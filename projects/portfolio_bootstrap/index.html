<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Bootstrap 5</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/custom-theme.css">
</head>
<body>
    <nav class="navbar navbar-expand-md site-nav">
        <div class="container">
            <a class="navbar-brand blank-name" href="index.html" aria-label="Portfolio owner name"></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavigation" aria-controls="mainNavigation" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNavigation">
                <ul class="navbar-nav ms-auto align-items-md-center">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#work">Work</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#about">About</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="blog.html">Blog</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#resume">Resume</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#contact">Calendly</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="site-main">
        <section class="container intro-section">
            <div class="row justify-content-center">
                <div class="col-12">
                    <div class="hero-placeholder" aria-label="Blank hero image placeholder"></div>
                </div>
            </div>

            <div class="row mt-5">
                <div class="col-lg-3">
                    <h1 class="display-5 fw-semibold mb-4">Work</h1>
                </div>
                <div class="col-lg-8 offset-lg-1">
                    <div class="blank-copy" aria-label="Blank introduction text">
                        <span class="blank-line w-100"></span>
                        <span class="blank-line w-85"></span>
                        <span class="blank-line w-70"></span>
                    </div>
                </div>
            </div>
        </section>

        <section id="work" class="container work-section">
            <div class="row g-4 g-xl-5">
                <div class="col-md-6">
                    <a class="work-tile" href="#case-study-1" aria-label="Blank case study">
                        <span class="work-image" aria-hidden="true"></span>
                        <span class="work-title blank-line w-75"></span>
                    </a>
                </div>
                <div class="col-md-6">
                    <a class="work-tile" href="#case-study-2" aria-label="Blank case study">
                        <span class="work-image" aria-hidden="true"></span>
                        <span class="work-title blank-line w-60"></span>
                    </a>
                </div>
                <div class="col-md-6">
                    <a class="work-tile" href="#case-study-3" aria-label="Blank case study">
                        <span class="work-image" aria-hidden="true"></span>
                        <span class="work-title blank-line w-70"></span>
                    </a>
                </div>
                <div class="col-md-6">
                    <a class="work-tile" href="#case-study-4" aria-label="Blank case study">
                        <span class="work-image" aria-hidden="true"></span>
                        <span class="work-title blank-line w-80"></span>
                    </a>
                </div>
                <div class="col-md-6">
                    <a class="work-tile" href="#case-study-5" aria-label="Blank case study">
                        <span class="work-image" aria-hidden="true"></span>
                        <span class="work-title blank-line w-65"></span>
                    </a>
                </div>
                <div class="col-md-6">
                    <a class="work-tile" href="#case-study-6" aria-label="Blank case study">
                        <span class="work-image" aria-hidden="true"></span>
                        <span class="work-title blank-line w-55"></span>
                    </a>
                </div>
            </div>
        </section>

        <section id="about" class="container about-section">
            <div class="row g-4 align-items-start">
                <div class="col-lg-3">
                    <h2 class="h3 fw-semibold mb-0">About</h2>
                </div>
                <div class="col-lg-8 offset-lg-1">
                    <div class="row g-4">
                        <div class="col-sm-4">
                            <div class="metric-block">
                                <span class="blank-line w-40"></span>
                                <span class="blank-line w-90"></span>
                            </div>
                        </div>
                        <div class="col-sm-4">
                            <div class="metric-block">
                                <span class="blank-line w-45"></span>
                                <span class="blank-line w-85"></span>
                            </div>
                        </div>
                        <div class="col-sm-4">
                            <div class="metric-block">
                                <span class="blank-line w-35"></span>
                                <span class="blank-line w-75"></span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section id="contact" class="container contact-section">
            <div class="row align-items-center g-4">
                <div class="col-lg-3">
                    <h2 class="h3 fw-semibold mb-0">Contact</h2>
                </div>
                <div class="col-lg-8 offset-lg-1">
                    <div class="d-flex flex-column flex-md-row justify-content-between gap-3 border-top pt-4">
                        <span class="blank-line w-50" aria-label="Blank email"></span>
                        <a class="btn btn-primary align-self-start" href="#contact">Book a call</a>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="container site-footer">
        <div class="row g-3 align-items-center">
            <div class="col-md-7">
                <div class="d-flex flex-wrap gap-3">
                    <span class="blank-line w-20"></span>
                    <span class="blank-line w-20"></span>
                    <span class="blank-line w-20"></span>
                </div>
            </div>
            <div class="col-md-5 text-md-end">
                <a class="footer-link" href="#work">All</a>
                <a class="footer-link" href="blog.html">Blog</a>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
